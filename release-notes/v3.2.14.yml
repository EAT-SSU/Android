ko: |
  - 다른 언어로 작성된 리뷰를 원하는 언어로 번역해서 볼 수 있어요.
  - 내 주변의 착한가격업소를 지도에서 둘러보고 찾을 수 있어요.
  - 마음에 드는 제휴 식당을 찜하고 지도로 빠르게 확인할 수 있어요.
  - 앱을 더 안정적이고 편리하게 이용할 수 있도록 사용성을 개선했어요.
en: |
  - You can now translate and read reviews written in other languages.
  - You can explore and find Good Price restaurants on the map.
  - You can save your favorite partnered restaurants and find them on the map.
  - App usability and stability have been improved for a smoother experience.
