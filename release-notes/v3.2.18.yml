ko: |
  - 오늘 식단과 검색에서 좋아하는 메뉴를 찜할 수 있어요.
  - 찜한 메뉴가 나오는 날에는 식사 시간과 식당을 알림으로 알려드려요.
  - 알림함에서 최근 알림을 확인하고 해당 날짜의 식당으로 바로 이동할 수 있어요.
en: |
  - Save your favorite dishes from today's meals or menu search.
  - Get meal times and cafeteria details when your favorite dishes are served.
  - View recent notifications and jump to the cafeteria for the corresponding date.
